# Kubernetes Deployment and Service definitions for Go Backend and Python Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-deployment
  namespace: ai-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent
        image: ai-agent:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: OLLAMA_URL
          value: "http://172.19.0.1:11434"
        - name: LOCALSTACK_URL
          value: "http://172.19.0.1:4566"
        - name: S3_BUCKET_NAME
          value: "ai-agent-storage"
        - name: POSTGRES_URL
          value: "postgresql://postgres:postgres@postgres-service:5432/aisandbox"
---
# Internal ClusterIP service exposing Python agent on port 5000
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: ai-sandbox
spec:
  selector:
    app: agent
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ai-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: go-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: AGENT_URL
          value: "http://agent-service:5000"
---
# NodePort service exposing Go API Gateway on node port 30080
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-sandbox
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080
