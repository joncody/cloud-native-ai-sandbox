# Kubernetes ConfigMap containing scrape target configuration for Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ai-sandbox
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'go-backend'
        static_configs:
          - targets: ['backend-service:8080']

      - job_name: 'python-agent'
        static_configs:
          - targets: ['agent-service:5000']
---
# Kubernetes Deployment for Prometheus monitoring server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: ai-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config
---
# NodePort service exposing Prometheus web UI on node port 30090
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: ai-sandbox
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - protocol: TCP
    port: 9090
    targetPort: 9090
    nodePort: 30090
